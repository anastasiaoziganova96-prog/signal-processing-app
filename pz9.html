<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПЗ №9 - Розовый шум</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← На главную</a>
        <h1 class="section-title">🩷 ПЗ №9: Розовый шум (1/f)</h1>
        
        <div class="control-group">
            <h3>Параметры</h3>
            <label>Длительность (сек):</label>
            <input type="range" id="duration9" min="0.5" max="5" value="2" step="0.1">
            <span id="duration9Val">2.0</span> с<br><br>
            
            <button id="genPinkNoise">Сгенерировать розовый шум</button>
            <button id="comparePinkWhite">Сравнить с белым шумом</button>
        </div>
        
        <div class="plot-container">
            <canvas id="pinkPlot" width="800" height="200"></canvas>
        </div>
        
        <div class="plot-container">
            <canvas id="pinkSpectrum" width="800" height="250"></canvas>
        </div>
        
        <div class="control-group">
            <h3>Прослушивание</h3>
            <button id="playPink">▶ Розовый шум</button>
            <button id="playWhiteCompare">▶ Белый шум (для сравнения)</button>
            <button id="stopPink">⏹️ Остановить</button>
        </div>
        
        <div class="info-panel" id="info9">
            🩷 Розовый шум имеет спектр ~ 1/f. Звучит более "естественно", чем белый шум
        </div>
    </div>
    <script src="pz9.js"></script>
</body>
</html>
