<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПЗ №5 - Пилообразный сигнал</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← На главную</a>
        <h1 class="section-title">🔺 ПЗ №5: Пилообразный сигнал (Sawtooth)</h1>
        
        <div class="control-group">
            <h3>🔺 ГЕНЕРАЦИЯ ПИЛООБРАЗНОГО СИГНАЛА</h3>
            <label>Частота (Гц):</label>
            <input type="range" id="freq5" min="100" max="2000" value="1000" step="10">
            <span id="freq5Val">1000</span> Гц<br><br>
            
            <label>Амплитуда:</label>
            <input type="range" id="amp5" min="0" max="1" value="1" step="0.05">
            <span id="amp5Val">1.0</span><br><br>
            
            <label>Ширина импульса (0-1):</label>
            <input type="range" id="width5" min="0" max="1" value="1" step="0.01">
            <span id="width5Val">1.0</span><br><br>
            
            <button id="genSawtooth">Сгенерировать пилообразный сигнал</button>
        </div>
        
        <div class="control-group">
            <h3>📁 ЗАГРУЗИТЕ СВОЙ WAV ФАЙЛ</h3>
            <input type="file" id="uploadWav5" accept=".wav,.mp3,.ogg">
            <button id="loadWav5">📥 Загрузить и сравнить</button>
        </div>
        
        <div class="plot-container">
            <canvas id="sawtoothPlot" width="800" height="200"></canvas>
        </div>
        
        <div class="plot-container">
            <canvas id="sawtoothSpectrum" width="800" height="200"></canvas>
        </div>
        
        <div class="control-group">
            <h3>🎵 ПРОСЛУШИВАНИЕ</h3>
            <button id="playSawtooth">▶ Прослушать пилообразный</button>
            <button id="playUploaded5">▶ Прослушать загруженный</button>
            <button id="stopSawtooth">⏹️ Остановить</button>
        </div>
        
        <div class="info-panel" id="info5">
            🔺 Пилообразный сигнал содержит все гармоники. Загрузите свой файл для сравнения
        </div>
    </div>
    <script src="pz5.js"></script>
</body>
</html>
