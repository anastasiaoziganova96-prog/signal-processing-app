<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПЗ №3 - Работа с аудиофайлами</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← На главную</a>
        <h1 class="section-title">🎚️ ПЗ №3: Работа с аудиофайлами</h1>
        
        <div class="control-group">
            <h3>📁 ЗАГРУЗИТЕ АУДИОФАЙЛ</h3>
            <input type="file" id="audioFile" accept=".wav,.mp3,.ogg">
            <button id="loadAudio">Загрузить и проанализировать</button>
        </div>
        
        <div class="control-group">
            <h3>🔄 ОБРАБОТКА</h3>
            <button id="playOriginal">▶ Прослушать оригинал</button>
            <button id="playSpeedUp">⚡ Ускорить (x1.5)</button>
            <button id="playSlowDown">🐌 Замедлить (x0.7)</button>
            <button id="stopAudio">⏹️ Остановить</button>
        </div>
        
        <div class="control-group">
            <h3>⚙️ ФИЛЬТРАЦИЯ</h3>
            <label>Low-pass фильтр (частота среза Гц):</label>
            <input type="range" id="cutoffFreq" min="100" max="4000" value="1000" step="50">
            <span id="cutoffVal">1000</span> Гц
            <button id="applyFilter">Применить фильтр</button>
        </div>
        
        <div class="plot-container">
            <canvas id="waveformPlot" width="800" height="200"></canvas>
        </div>
        
        <div class="plot-container">
            <canvas id="spectrumPlot" width="800" height="200"></canvas>
        </div>
        
        <div class="plot-container">
            <canvas id="spectrogramPlot" width="800" height="200"></canvas>
        </div>
        
        <div class="info-panel" id="info3">
            ⚡ Готов к загрузке аудиофайлов (WAV, MP3, OGG)
        </div>
    </div>
    <script src="pz3.js"></script>
</body>
</html>
