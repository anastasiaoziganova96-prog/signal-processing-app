<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПЗ №7 - Белый шум</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← На главную</a>
        <h1 class="section-title">🔊 ПЗ №7: Белый (некоррелированный) шум</h1>
        
        <div class="control-group">
            <h3>🎛️ ГЕНЕРАЦИЯ БЕЛОГО ШУМА</h3>
            <label>Длительность (сек):</label>
            <input type="range" id="duration7" min="0.5" max="5" value="2" step="0.1">
            <span id="duration7Val">2.0</span> с<br><br>
            
            <label>Амплитуда:</label>
            <input type="range" id="amp7" min="0" max="1" value="0.8" step="0.05">
            <span id="amp7Val">0.8</span><br><br>
            
            <button id="genWhiteNoise">🎲 Сгенерировать белый шум</button>
        </div>
        
        <div class="control-group">
            <h3>📁 ЗАГРУЗИТЕ АУДИОФАЙЛ ДЛЯ СРАВНЕНИЯ</h3>
            <input type="file" id="uploadWav7" accept=".wav,.mp3,.ogg">
            <button id="loadWav7">📥 Загрузить и сравнить спектры</button>
        </div>
        
        <div class="plot-container">
            <canvas id="whitePlot" width="800" height="200"></canvas>
        </div>
        
        <div class="plot-container">
            <canvas id="whiteSpectrum" width="800" height="250"></canvas>
        </div>
        
        <div class="plot-container">
            <canvas id="whiteSpectrogram" width="800" height="200"></canvas>
        </div>
        
        <div class="control-group">
            <h3>🎵 ПРОСЛУШИВАНИЕ</h3>
            <button id="playWhite">▶ Белый шум</button>
            <button id="playUploaded7">▶ Загруженный файл</button>
            <button id="stopWhite">⏹️ Остановить</button>
        </div>
        
        <div class="info-panel" id="info7">
            🔊 Белый шум имеет равномерный спектр мощности на всех частотах.<br>
            Загрузите свой аудиофайл для сравнения спектров.
        </div>
    </div>
    <script src="pz7.js"></script>
</body>
</html>
