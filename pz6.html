<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПЗ №6 - Chirp сигналы</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← На главную</a>
        <h1 class="section-title">📈 ПЗ №6: Chirp сигналы</h1>
        
        <div class="control-group">
            <h3>Параметры Chirp сигнала</h3>
            <label>Начальная частота (Гц):</label>
            <input type="range" id="f0" min="100" max="5000" value="100" step="10">
            <span id="f0Val">100</span> Гц<br><br>
            
            <label>Конечная частота (Гц):</label>
            <input type="range" id="f1" min="100" max="8000" value="3000" step="10">
            <span id="f1Val">3000</span> Гц<br><br>
            
            <label>Длительность (сек):</label>
            <input type="range" id="duration6" min="0.5" max="5" value="2" step="0.1">
            <span id="duration6Val">2.0</span> с<br><br>
            
            <label>Тип Chirp:</label>
            <select id="chirpType">
                <option value="linear">Линейный</option>
                <option value="quadratic">Квадратичный</option>
                <option value="logarithmic">Логарифмический</option>
            </select><br><br>
            
            <button id="genChirp">Сгенерировать Chirp</button>
        </div>
        
        <div class="plot-container">
            <canvas id="chirpPlot" width="800" height="200"></canvas>
        </div>
        
        <div class="plot-container">
            <canvas id="chirpSpectrogram" width="800" height="250"></canvas>
        </div>
        
        <div class="control-group">
            <h3>Прослушивание</h3>
            <button id="playChirp">▶ Прослушать</button>
            <button id="stopChirp">⏹️ Остановить</button>
        </div>
        
        <div class="info-panel" id="info6">
            📈 Линейный Chirp: частота изменяется линейно от f0 до f1
        </div>
    </div>
    <script src="pz6.js"></script>
</body>
</html>
